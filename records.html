<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全公司账号问题处理手册</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23193732'/%3E%3Cpath d='M18 33l9 9 20-22' fill='none' stroke='%23c5ef85' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{--ink:#193732;--muted:#6c7b76;--bg:#f5f7f3;--line:#e0e7dc;--lime:#d4eea7;--green:#257057;--red:#a44544}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.card{width:min(400px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 32px 32px;box-shadow:0 9px 20px #1937320b}
.brand{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:700;margin-bottom:28px}
.brand small{display:block;font-size:9px;letter-spacing:2px;font-weight:400;color:#adc1b5}
.mark{background:var(--lime);color:#193732;width:38px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:26px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input[type=password]{width:100%;border:1px solid #cedac7;border-radius:12px;padding:12px 17px;font:inherit;color:var(--ink);outline:none;background:#fff}
input[type=password]:focus{outline:2px solid #97b878}
button{margin-top:16px;width:100%;border:0;border-radius:10px;padding:12px 16px;background:#193732;color:#edf6df;font:inherit;font-weight:600;cursor:pointer}
button:hover:not(:disabled){background:var(--green)}
button:disabled{opacity:.7;cursor:default}
.err{margin-top:12px;color:var(--red);font-size:13px;min-height:1.3em}
.remember{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5;cursor:pointer;font-weight:400}
.remember input{margin:3px 0 0;flex:none;accent-color:#193732}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="current-password">
  <div class="brand"><span class="mark">✓</span><div>全公司账号手册<small>ACCOUNT CARE</small></div></div>
  <label for="pw">请输入密码</label>
  <input id="pw" type="password" name="password" required autofocus>
  <label class="remember" for="remember">
    <input id="remember" type="checkbox">
    在这台设备上记住（仅自己的设备勾选）
  </label>
  <button type="submit">进入手册</button>
  <div class="err" id="err" hidden>密码错误</div>
</form>

(function () {
  const STORE = "bk-handbook-unlock";
  const form = document.getElementById("gate");
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");
  const remember = document.getElementById("remember");
  const btn = form.querySelector("button");

  function b64(s) {
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64enc(buf) {
    const u8 = new Uint8Array(buf);
    let s = "";
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
      s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  async function decryptWithKey(key) {
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(PAYLOAD.iv) },
      key,
      b64(PAYLOAD.ct)
    );
    return new TextDecoder().decode(pt);
  }

  function render(html) {
    var go = function () {
      document.open("text/html", "replace");
      document.write(html);
      document.close();
    };
    // document.write during initial parse appends instead of replacing,
    // which would leave the gate form on top of the handbook. Always
    // write after the current document has finished loading.
    if (document.readyState === "complete") go();
    else if (document.readyState === "interactive") setTimeout(go, 0);
    else window.addEventListener("load", go);
  }

  function record(kB64) {
    return JSON.stringify({ k: kB64, salt: PAYLOAD.salt, iter: PAYLOAD.iter });
  }

  function readStore(storage) {
    try {
      const raw = storage.getItem(STORE);
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (!o || o.salt !== PAYLOAD.salt || o.iter !== PAYLOAD.iter || !o.k) {
        storage.removeItem(STORE);
        return null;
      }
      return o.k;
    } catch (e) {
      try { storage.removeItem(STORE); } catch (e2) {}
      return null;
    }
  }

  function clearStores() {
    try { sessionStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(STORE); } catch (e) {}
  }

  async function importRaw(kB64) {
    return crypto.subtle.importKey(
      "raw",
      b64(kB64),
      { name: "AES-GCM" },
      false,
      ["decrypt"]
    );
  }

  async function saveKey(key, persistDevice) {
    const raw = await crypto.subtle.exportKey("raw", key);
    const rec = record(b64enc(raw));
    sessionStorage.setItem(STORE, rec);
    if (persistDevice) localStorage.setItem(STORE, rec);
  }

  async function loadCachedKey() {
    for (const storage of [localStorage, sessionStorage]) {
      const k = readStore(storage);
      if (!k) continue;
      try {
        return await importRaw(k);
      } catch (e) {
        try { storage.removeItem(STORE); } catch (e2) {}
      }
    }
    return null;
  }

  async function derive(password) {
    const material = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64(PAYLOAD.salt),
        iterations: PAYLOAD.iter,
        hash: "SHA-256"
      },
      material,
      { name: "AES-GCM", length: 256 },
      true,
      ["decrypt"]
    );
  }

  async function unlock(key, persist) {
    const html = await decryptWithKey(key);
    if (persist) await saveKey(key, !!(remember && remember.checked));
    render(html);
  }

  async function boot() {
    const cached = await loadCachedKey();
    if (cached) {
      try {
        await unlock(cached, false);
        return;
      } catch (e) {
        clearStores();
      }
    }
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      try {
        const key = await derive(pw.value);
        await unlock(key, true);
      } catch (e) {
        err.hidden = false;
        err.textContent = "密码错误";
        btn.disabled = false;
        pw.focus();
        pw.select();
      }
    });
  }

  boot();
})();
